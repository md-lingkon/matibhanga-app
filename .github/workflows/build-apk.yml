name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "www/**"
      - "assets/**"
      - "native/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stamp build number into app
        run: sed -i "s/var APP_BUILD = 0;/var APP_BUILD = ${{ github.run_number }};/" www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Apply in-app browser, print and download support
        run: |
          if [ ! -f native/MainActivity.java ]; then
            echo "ERROR: native/MainActivity.java রিপোতে নেই — আগে এই ফাইলটি আপলোড করুন"
            exit 1
          fi
          mkdir -p android/app/src/main/java/com/matibhanga/college
          cp native/MainActivity.java android/app/src/main/java/com/matibhanga/college/MainActivity.java
          if [ ! -f native/mb-inject.js ]; then
            echo "ERROR: native/mb-inject.js রিপোতে নেই — আগে এই ফাইলটি আপলোড করুন"
            exit 1
          fi
          mkdir -p android/app/src/main/assets
          cp native/mb-inject.js android/app/src/main/assets/mb-inject.js
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.webkit:webkit:1.10.0"/' android/app/build.gradle
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "webkit" android/app/build.gradle || true
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml || true

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Use permanent signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "স্থায়ী সাইনিং কী ব্যবহার হচ্ছে"
          else
            echo "KEYSTORE_BASE64 সেট করা নেই — সাময়িক কী ব্যবহার হবে"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show signing fingerprint
        run: |
          echo "==== এই APK-এর সাইনিং ফিঙ্গারপ্রিন্ট (প্রতিবার এক হতে হবে) ===="
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA256|Owner" || echo "ফিঙ্গারপ্রিন্ট পড়া যায়নি"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk matibhanga-college.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: matibhanga-college-apk
          path: matibhanga-college.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "অ্যাপ সংস্করণ ${{ github.run_number }}"
          body: "মাটিভাঙ্গা ডিগ্রি কলেজ অ্যাপ — নতুন সংস্করণ। matibhanga-college.apk ডাউনলোড করে ইনস্টল করুন।"
          files: matibhanga-college.apk
          make_latest: true
