name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "www/**"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stamp build number into app
        run: sed -i "s/var APP_BUILD = 0;/var APP_BUILD = ${{ github.run_number }};/" www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk matibhanga-college.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: matibhanga-college-apk
          path: matibhanga-college.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "অ্যাপ সংস্করণ ${{ github.run_number }}"
          body: "মাটিভাঙ্গা ডিগ্রি কলেজ অ্যাপ — নতুন সংস্করণ। matibhanga-college.apk ডাউনলোড করে ইনস্টল করুন।"
          files: matibhanga-college.apk
          make_latest: true
